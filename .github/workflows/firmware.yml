name: Firmware V2
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/bench_test.cpp -o /tmp/bench && /tmp/bench
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/camera_test.cpp -o /tmp/camera-test && /tmp/camera-test
      - run: python3 -m unittest discover -s tests -p 'test_camera*.py'
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [eitek-master, esp32-slave, esp32-camera-bench]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.1.18
      - run: pio run -e ${{ matrix.env }}
