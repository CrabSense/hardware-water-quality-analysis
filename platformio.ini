[platformio]
src_dir = firmware
default_envs = eitek-master, esp32-slave

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:eitek-master]
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_src_filter = -<*> +<eitek-master/>
lib_deps = adafruit/Adafruit ADS1X15@2.5.0

[env:esp32-slave]
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM
build_src_filter = -<*> +<esp32-slave/>
lib_deps = adafruit/Adafruit MAX31865 library@1.6.2

; Camera-only commissioning firmware. Never drives relay/dosing GPIO.
[env:esp32-camera-bench]
extends = env:esp32-slave
build_src_filter = -<*> +<esp32-camera-bench/>
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_USB_Stream.git#8854d03856afe1292e72d4fbb2bfdbc1ff21f61f
